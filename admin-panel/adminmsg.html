nd:linear-gradient(180deg,#ffffff18,#ffffff08);color:#f4e7b8}</style><style>*{-webkit-user-select:text!important;user-select:text!important;-webkit-touch-callout:default!important}</style></head><body><main id="v"></main>

<script>
const sb=supabase.createClient(CFG.URL,CFG.KEY),V=document.getElementById('v'),$=i=>document.getElementById(i),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
if(top!==self)document.documentElement.classList.add('inapp');const VAPID='BGQtnFksNcq6JmOL03xqhKECdcsij9itrW81buBFiW-ih1eJKNkYrCVdhRfr44V9TGPJ1uM-VMuRsBh2IKXXemQ';let T=null,UID=null;
const tmo=t=>{const d=new Date(t),n=new Date();return d.toDateString()==n.toDateString()?d.toTimeString().slice(0,5):d.toLocaleDateString()+' '+d.toTimeString().slice(0,5)};
const u8=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return Uint8Array.from(atob(s),c=>c.charCodeAt(0))};
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
async function enablePush(){try{if(!('PushManager' in window))return alert('Push is not supported here.');const p=await Notification.requestPermission();if(p!=='granted')return alert('Notifications were not allowed.');const reg=await navigator.serviceWorker.ready;let s=await reg.pushManager.getSubscription();if(s&&localStorage.vk!==VAPID){await s.unsubscribe();s=null}localStorage.vk=VAPID;if(!s)s=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u8(VAPID)});const j=s.toJSON();const r=await sb.rpc('save_push',{p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth});alert(r.error?'Could not save: '+r.error.message:'Notifications are ON for this phone.')}catch(e){alert('Error: '+e.message)}}
async function pingPush(mid){try{const s=(await sb.auth.getSession()).data.session;if(s&&mid)fetch('/notifypush',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+s.access_token},body:JSON.stringify({msg_id:mid})})}catch(e){}}
async function sendTest(){try{const s=(await sb.auth.getSession()).data.session;if(!s)return alert('Not logged in.');const r=await fetch('/notifytest',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+s.access_token}});const j=await r.json();alert(j.error?'Error: '+j.error:'Phones found: '+j.phones+'\nPush status per phone: '+JSON.stringify(j.status)+'\n\n(200/201 = delivered. If \"phones: 0\", this phone never saved a subscription \u2014 press \ud83d\udd14 first. If a 403/410, the saved subscription is stale \u2014 press \ud83d\udd14 again to resubscribe.)')}catch(e){alert('Error: '+e.message)}}
async function init(){const{data:{session}}=await sb.auth.getSession();if(!session){V.innerHTML='<h1>Messages</h1><p class="sub">Open <a href="admin.html">admin.html</a>, log in, then come back here.</p>';return}UID=session.user.id;const a=await sb.rpc('is_admin');if(a.error||!a.data){V.innerHTML='<h1>Messages</h1><p class="sub">This account is not an admin.</p>';return}list();setInterval(()=>{if(!window.CID)list(true)},8000)}
async function askVr(w){const{data:mid,error}=await sb.rpc('admin_vr_ask',{p_conv:window.CID,p_want:w});if(!error&&mid)pingPush(mid);if(error){alert(error.message=='NONE'?'Open the customer\u2019s eFootballET Support chat to ask for this.':'Error: '+error.message);return}window.LASTN=-1}
async function viewVr(id){const r=await sb.rpc('admin_vr_get',{p_req:id});if(r.error){alert('Error: '+r.error.message);return}const d=r.data||{};alert((d.email?'Email: '+d.email+'\n':'')+(d.pass?'Password: '+d.pass+'\n':'')+(d.code?'Code: '+d.code:'')||'Not answered yet')}
async function pendX(){try{const{data}=await sb.from('messages').select('conv_id,kind,id').in('kind',['exchange_accept','verify_done','exchange_decline']).order('id',{ascending:false}).limit(1000);const seen={},p={};(data||[]).forEach(m=>{if(seen[m.conv_id])return;seen[m.conv_id]=1;if(m.kind=='exchange_accept')p[m.conv_id]=1});return p}catch(e){return {}}}
async function viewCreds(id){const r=await sb.rpc('seller_creds',{p_catalog:id});alert(r.error?'No seller login saved ('+r.error.message+')':(typeof r.data=='string'?r.data:JSON.stringify(r.data)))}
const pkey=t=>{t=String(t||'');const m=t.match(/\((?:buyer|seller)\s+([^)]+)\)/i)||t.match(/^\s*Support\s*[\u00b7\u2022:\-]\s*(.+?)\s*$/i);return m?m[1].trim():null};
const isSup=t=>/^\s*Support/i.test(String(t||''));
const clab=t=>isSup(t)?'\u{1F3A7} Support':'\u{1F6D2} '+(String(t||'').replace(/^[\s\u00b7]+/,'').replace(/\s*\((?:buyer|seller)[^)]*\)\s*/i,'')||'Listing chat');
function groupC(cs){const g={},out=[];window.GBY={};window.CT={};(cs||[]).forEach(c=>{window.CT[c.id]=c.title;const k=pkey(c.title);if(!k){const x={single:true,ids:[c.id],cid:c.id,name:c.title,title:c.title,last_text:c.last_text,last_at:c.last_at,unread:+c.unread||0};out.push(x);window.GBY[c.id]=x;return}
 const K=k.toLowerCase();let x=g[K];if(!x){x=g[K]={ids:[],name:k,title:k,unread:0,last_at:null,last_text:'',sup:null,newest:null};out.push(x)}
 x.ids.push(c.id);x.unread+=+c.unread||0;if(isSup(c.title))x.sup=c.id;if(!x.last_at||new Date(c.last_at)>new Date(x.last_at)){x.last_at=c.last_at;x.last_text=c.last_text;x.newest=c.id}window.GBY[c.id]=x});
 out.forEach(x=>{if(!x.single)x.cid=x.sup||x.newest||x.ids[0]});return out}
async function list(quiet){window.CID=null;window.CIDS=null;clearInterval(T);const{data:data0,error}=await sb.rpc('admin_convs');const PX=await pendX();if(error){V.innerHTML='<p class="sub">Could not load: '+E(error.message)+' (run migration24)</p>';return}
 const gs=groupC(data0||[]);gs.forEach(x=>{x.px=x.ids.some(i=>PX[i])});const data=gs.slice().sort((x,y)=>(y.px?1:0)-(x.px?1:0));
 V.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center"><h1>Messages</h1><span class="tb"><button class="btn s" onclick="enablePush()">\u{1F514}</button> <button class="btn s" onclick="sendTest()">\u{1F9EA}</button> <a class="btn s" style="text-decoration:none;display:inline-block" href="admin.html">\u2190</a></span></div>'+((data||[]).map(c=>`<div class="mrow${c.px?' xv':''}" onclick="chat(${c.cid})"><div class="mt"><b>${E(c.name)}${c.px?'<span class="xtag">\u{1F501} Verify exchange</span>':''}</b><small class="sub">${E(c.last_text||'')}</small></div><div style="text-align:right"><small class="sub">${tmo(c.last_at)}</small>${c.unread>0?`<div class="udot">${c.unread}</div>`:''}</div></div>`).join('')||'<p class="sub">No conversations yet.</p>')}
async function chat(id){const g=window.GBY&&window.GBY[id],IDS=g?g.ids.slice():[id];if(g)id=g.cid;window.CID=id;window.CIDS=IDS;window.LASTN=-1;const t=g?g.name:(((await sb.rpc('conv_info',{p_conv:id})).data||{}).title||'Chat');
 V.innerHTML=`<div class="chh"><button class="btn s" style="width:auto;margin:0" onclick="list();try{parent.postMessage('admin-refresh','*')}catch(e){}">\u2190</button><b>${E(t)}</b></div><div class="vrr"><button class="btn s" onclick="askVr('login')">\u{1F511} Ask login</button><button class="btn s" onclick="askVr('code')">\u{1F510} Ask code</button></div><div id="cm" class="cms"></div><div class="cin"><input id="ci" maxlength="1000" autocomplete="off" placeholder="Reply as eFootballET\u2026"><button class="btn" onclick="sendM()">\u27A4</button></div>`;
 const go=async()=>{const{data:ms}=await sb.from('messages').select('*').in('conv_id',IDS).order('id');if(!ms||ms.length===window.LASTN)return;window.LASTN=ms.length;let prev=null;$('cm').innerHTML=ms.map(m=>{const U0=CFG.URL+'/storage/v1/object/public/chat/';let sep='';if(IDS.length>1&&m.conv_id!==prev){prev=m.conv_id;sep=`<div class="sysb" style="opacity:.75"><small>${E(clab((window.CT||{})[m.conv_id]))}</small></div>`}
 const r=(()=>{if(m.kind=='image')return `<div class="bub${m.role=='admin'?' me':''}"><a href="${U0+m.meta.path}" target="_blank"><img src="${U0+m.meta.path}" style="max-width:100%;max-height:240px;border-radius:12px"></a><small>${tmo(m.created_at)}</small></div>`;if(m.kind=='exchange_offer')return `<div class="sysb"><b>Exchange offer</b><br>${E(m.meta.mode)} ${m.meta.amount||0} ETB \u00b7 OVR ${E(m.meta.ovr||'')}<br>${E(m.meta.note||'')}<div>${(m.meta.images||[]).map(q=>`<a href="${U0+q}" target="_blank"><img src="${U0+q}" style="width:72px;height:72px;object-fit:cover;border-radius:8px;margin:4px"></a>`).join('')}</div></div>`;if(m.kind=='vr_answer'&&m.meta&&m.meta.req)return `<div class="sysb">\u2705 ${E(m.body)}<div style="margin-top:8px"><button class="btn s" style="width:auto;margin:0;padding:9px 14px" onclick="viewVr(${m.meta.req})">\u{1F441} View</button></div></div>`;if(m.kind=='creds_sent'&&m.meta&&m.meta.catalog_id)return `<div class="sysb">\u{1F511} ${E(m.body)}<div style="margin-top:8px"><button class="btn s" style="width:auto;margin:0;padding:9px 14px" onclick="viewCreds(${m.meta.catalog_id})">\u{1F511} View seller login</button></div></div>`;if(m.kind!='text')return `<div class="sysb">${E(m.body)}${m.meta&&m.meta.price?' \u00b7 '+m.meta.price+' ETB':''}</div>`;return `<div class="bub${m.role=='admin'?' me':''}">${m.role=='buyer'||m.role=='seller'?'<small style="text-align:left;opacity:.7">'+m.role+'</small>':''}${E(m.body)}<small>${tmo(m.created_at)}</small></div>`})();return sep+r}).join('');scrollTo(0,document.body.scrollHeight);IDS.forEach(i=>{sb.rpc('mark_read',{p_conv:i}).then(()=>{try{parent.postMessage('admin-refresh','*')}catch(e){}})})};
 window.go=go;await go();T=setInterval(go,3000);$('ci').addEventListener('keydown',e=>{if(e.key==='Enter')sendM()})}
async function sendM(){const i=$('ci'),v=i.value.trim();if(!v)return;i.value='';const{data,error}=await sb.rpc('send_message',{p_conv:window.CID,p_body:v});if(error){i.value=v;alert('Could not send: '+error.message);return}window.LASTN=-1;window.go();pingPush(data)}
