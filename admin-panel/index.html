nav button.on{background:linear-gradient(180deg,#F2B70533,#F2B7050f);color:#F2B705}nav .ei{font-style:normal;font-size:20px}
.bd{position:absolute;top:2px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:99px;background:#ef4444;color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}.bd[hidden]{display:none}
.lg{max-width:380px;margin:12vh auto 0}.lg input{width:100%;box-sizing:border-box;margin:6px 0 12px}.err{color:#ef4444;min-height:20px}

.tile.hot{border-color:var(--a);box-shadow:0 0 0 1px var(--a) inset}.tile .n{font-size:30px;font-weight:800;line-height:1.1}.tile small{display:block;color:var(--h)}
.big{grid-column:1/-1}
.cs{background:linear-gradient(160deg,#1c1f33,#121423);border:1px solid #ffffff17;border-radius:18px;margin-bottom:10px;overflow:hidden}.cs.open{border-color:#F2B70566}
.csh{display:flex;gap:10px;align-items:center;padding:13px;cursor:pointer}.csh .m{flex:1;min-width:0}.csh .m b{display:block;font-size:15px}.csh .m small{display:block;color:var(--h);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.st.g{background:#22c3a622;color:#22C3A6;border-color:#22c3a655}.st.r{background:#ef444422;color:#ef4444;border-color:#ef444455}
.stp{border-top:1px solid #ffffff12;padding:10px 0}.sth{display:flex;align-items:center;gap:9px}.sth i{font-style:normal;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#ffffff14;color:var(--h);font-weight:800;font-size:12.5px;flex:none}
.stp.now .sth i{background:#F2B705;color:#000}.stp.done .sth i{background:#22c3a6;color:#00130f}.stp.done .sth b{color:#22C3A6}
.stb{margin:7px 0 0 33px;line-height:1.65;word-break:break-word}.stb .row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.stb .btn{flex:1 1 130px;width:auto;margin:0;min-height:44px;padding:8px 10px}

.menu{display:flex;flex-direction:column;gap:10px}.menu button{display:flex;justify-content:space-between;align-items:center;text-align:left;padding:14px;border-radius:16px;background:#181a26;border:1px solid #ffffff14;color:var(--t);font:inherit}.menu small{display:block;color:var(--h)}

.kbox{width:100%;max-width:380px;text-align:center;background:linear-gradient(160deg,#241c4d,#121423);border:1px solid #F2B70577;border-radius:24px;padding:22px 18px;box-shadow:0 0 40px #F2B70533,0 20px 50px #000a}
.kbox .kt{font-weight:800;font-size:18px}

<script>
const sb=supabase.createClient(CFG.URL,CFG.KEY),$=i=>document.getElementById(i);
const VAPID='BA7-v2x2GvoU1Jcuf1WqX1z6o787aSupTfXRWXZkysCgAGKaJTE78Qv0R2hUUibxGF6dtl40nESqBebHb1CthAc';
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const u8=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return Uint8Array.from(atob(s),c=>c.charCodeAt(0))};
const BUILD=Date.now();let cur='home',ME=null,timer=null,KSEEN={};try{KSEEN=JSON.parse(localStorage.kseen||'{}')}catch(e){}
if('serviceWorker' in navigator)navigator.serviceWorker.register('/admin-panel/sw.js',{scope:'/admin-panel/'}).catch(()=>{});

/* ---------- meaning of the letters and codes ---------- */
const CT={1:'Data transfer code',2:'Konami login code',3:'Email change code'};
const CASK={1:'Please send Code 1 — the data transfer code.',2:'Please send Code 2 — the code Konami emailed so the account can log in.',3:'Please send Code 3 — the code Konami emailed to confirm the email change.'};
const LEGEND=`<div class="lgd"><p><span>A</span>Coin buyer</p><p><span>B</span>Account seller</p><p><span>E</span>Account buyer</p><p><span>C</span>Account owner (listed, accepted the swap)</p><p><span>F</span>Swap requester (sent the swap request)</p><hr style="border-color:#ffffff14"><p><b>Code 1</b> · Data transfer code</p><p><b>Code 2</b> · Konami login code</p><p><b>Code 3</b> · Email change code</p></div>`;

/* ---------- small helpers ---------- */
const ago=t=>{if(!t)return '';const m=Math.max(0,Math.round((Date.now()-new Date(t))/60000));return m<1?'now':m<60?m+' min ago':m<1440?Math.floor(m/60)+' h ago':Math.floor(m/1440)+' d ago'};
function cpd(b){const t=b.dataset.t||'';try{navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(x){}a.remove()}b.textContent='✅';setTimeout(()=>b.textContent='📋',1200)}
const cpB=t=>`<button class="cpb" data-t="${E(t)}" onclick="event.stopPropagation();cpd(this)">📋</button>`;
const chip=(t,c)=>`<span class="st ${c||''}">${t}</span>`;
const stp=(n,t,s,b)=>`<div class="stp ${s}"><div class="sth"><i>${s=='done'?'✓':n}</i><b>${t}</b></div><div class="stb">${b}</div></div>`;
const bt=(t,f,c)=>`<button class="btn ${c||'s'}" onclick="${f}">${t}</button>`;
const loginH=(e,p)=>e||p?`<div>📧 <code>${E(e||'—')}</code> ${e?cpB(e):''}</div><div>🔑 <code>${E(p||'—')}</code> ${p?cpB(p):''}</div>`:'<small class="sub">—</small>';
const codeH=(c,at)=>`<span class="code">${E(c)}</span> ${cpB(c)}${at?`<div><small class="sub">⏱ received ${ago(at)}</small></div>`:''}`;
const splitLogin=t=>{if(t==null)return['',''];if(typeof t=='object')return[t.email||t.e||'',t.pass||t.password||t.p||''];const m=String(t).trim().match(/^(\S+?)[\s:|]+([\s\S]+)$/);return m?[m[1],m[2].trim()]:['',String(t)]};
const pkey=t=>{t=String(t||'');const m=t.match(/\((?:buyer|seller)\s+([^)]+)\)/i)||t.match(/^\s*Support\s*[\u00b7\u2022:\-]\s*(.+?)\s*$/i);return m?m[1].trim():null};
const isSupT=t=>/^\s*Support/i.test(String(t||''));
async function pingPush(mid){try{const s=(await sb.auth.getSession()).data.session;if(s&&mid)fetch('/notifypush',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+s.access_token},body:JSON.stringify({msg_id:mid})})}catch(e){}}
async function shrink(f){const u=URL.createObjectURL(f);try{const i=await new Promise((ok,no)=>{const n=new Image();n.onload=()=>ok(n);n.onerror=no;n.src=u});const k=Math.min(1,1280/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);return await new Promise(ok=>c.toBlob(ok,'image/jpeg',.82))}finally{URL.revokeObjectURL(u)}}

/* ---------- login ---------- */
function login(msg=''){clearInterval(timer);$('nav').hidden=true;$('fo').hidden=$('fm').hidden=true;$('v').hidden=false;$('who').textContent='';
 $('v').innerHTML=`<div class="lg"><h1>🔐 eFootballET ADMIN</h1><label>Email</label><input id="em" type="email" autocomplete="username"><label>Password</label><input id="pw" type="password" autocomplete="current-password"><div class="err">${E(msg)}</div><button class="btn" id="lgb">Log in</button></div>`;
 $('lgb').onclick=async()=>{$('lgb').disabled=true;const{error}=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});if(error){login('Wrong email or password');return}start()}}
async function start(){
 const{data:{session}}=await sb.auth.getSession();if(!session)return login();
 const a=await sb.rpc('is_admin');if(a.error||!a.data){await sb.auth.signOut();return login('This account is not an admin.')}
 ME=session.user;$('who').textContent=(ME.email||'').split('@')[0];$('nav').hidden=false;
 const h=location.hash.slice(1);go(['coins','sales','swaps','chat','more'].includes(h)?h:'home');
 clearInterval(timer);timer=setInterval(tick,4500);ensurePush(true)}

/* ---------- data ---------- */
let D={orders:[],convs:[],ready:{},xm:[],steps:[],cat:[],conv:null,subs:0,sc:{}},XS={sup:{},party:{},val:{}},CRD={},OPEN={},BUSY=0;
const XK=['exchange_offer','exchange_accept','exchange_decline','verify_done','fee_sender','fee_ask','fee_agree','fee_decline'];
async function load(){
 const[o,c,r,xm,st,cat,cv,sb2,rm]=await Promise.all([
  sb.from('orders').select('*').order('id',{ascending:false}).limit(300),
  sb.rpc('admin_convs'),sb.from('order_ready').select('*'),
  sb.from('messages').select('conv_id,id,kind,sender_id,meta,created_at').in('kind',XK).order('id',{ascending:false}).limit(1500),
  sb.from('messages').select('id,conv_id,meta,created_at').not('meta->>adm','is',null).order('id',{ascending:false}).limit(1000),
  sb.from('catalog').select('*').in('cat',['account','player']).order('id',{ascending:false}).limit(300),
  sb.from('conversations').select('*').limit(2000),
  sb.from('submissions').select('id').eq('status','pending').limit(100),
  sb.from('messages').select('meta,created_at').not('meta->>ready','is',null).order('id',{ascending:false}).limit(200)]);
 if(o.error&&/JWT|auth/i.test(o.error.message||''))return login('Please log in again.');
 D.orders=o.data||D.orders;D.convs=c.data||D.convs;D.xm=xm.data||D.xm;D.steps=st.data||D.steps;D.cat=cat.data||D.cat;D.conv=cv.error?D.conv:(cv.data||null);D.subs=(sb2.data||[]).length;
 const ready={};(r.data||[]).forEach(x=>{ready[x.order_code]=x.ready_at});(rm.data||[]).forEach(x=>{const k=x.meta&&x.meta.ready;if(k&&!ready[k])ready[k]=x.created_at});D.ready=ready;
 // seller codes of every active sale
 const ids=[...new Set(saleOrders().filter(x=>x.status!='delivered').map(x=>x.catalog_id))];
 await Promise.all(ids.map(async id=>{const q=await sb.rpc('seller_codes',{p_catalog:id});if(!q.error)D.sc[id]=q.data||{}}));
 // badges + new Konami code alerts
 const cn=coinOrders().filter(x=>['awaiting_review','approved'].includes(x.status)).length,sn=saleOrders().filter(x=>x.status!='delivered'&&x.status!='rejected').length,xn=swapCases().length,un=D.convs.reduce((s,x)=>s+(+x.unread||0),0);
 [['b1',cn],['b2',sn],['b3',xn],['b4',un]].forEach(([i,n])=>{$(i).textContent=n>99?'99+':n;$(i).hidden=!n});
 document.title=(cn+sn+xn+un)?`(${cn+sn+xn+un}) eFootballET ADMIN`:'eFootballET ADMIN';
 let fresh=null;D.orders.forEach(x=>{if(x.status!='approved'||!x.kcode)return;const k=x.id+':'+x.kcode;if(!KSEEN[k]){KSEEN[k]=Date.now();fresh=x}});
 if(fresh){const ks=Object.entries(KSEEN).sort((a,b)=>b[1]-a[1]).slice(0,60);KSEEN=Object.fromEntries(ks);try{localStorage.kseen=JSON.stringify(KSEEN)}catch(e){}if(!document.hidden)showCode(fresh)}
}
const coinOrders=()=>D.orders.filter(o=>o.cat==='ef');
const saleOrders=()=>D.orders.filter(o=>['account','player'].includes(o.cat)&&o.catalog_id);
const listing=id=>D.cat.find(l=>l.id==id)||{};
function mk(ref){const o={};(D.steps||[]).forEach(m=>{const x=m.meta;if(x&&x.ref===ref&&x.step&&!o[x.step])o[x.step]=m.created_at});return o}
async function note(uid,text,ref,step){ // message to a customer; with ref+step it is also the saved progress mark
 if(!uid){alert('No user account found for this person.');return false}
 const{data,error}=await sb.rpc('notify_user',{p_user:uid,p_text:text,p_kind:'text',p_meta:ref?{adm:1,ref,step}:{adm:1}});
 if(error){alert('Failed: '+error.message);return false}pingPush(data);return true}
const act=async fn=>{if(BUSY)return;BUSY=1;try{await fn();await load()}catch(e){alert('Error: '+(e.message||e))}finally{BUSY=0;paint()}};

/* ---------- navigation ---------- */
function setNav(t){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t))}
function frame(id,src){const f=$(id);if(f.getAttribute('src')!==src)f.src=src;return f}
function go(t,hash){cur=t;setNav(t==='more'?'':t);const fr=t==='chat'||t==='classic';
 $('v').hidden=fr;$('fm').hidden=t!=='chat';$('fo').hidden=t!=='classic';
 if(t==='chat')frame('fm','/adminmsg.html?v='+BUILD);
 if(t==='classic')frame('fo','/admin.html?v='+BUILD+'#'+(hash||'delivered'));
 if(!fr){$('v').scrollTop=0;paint()}
 history.replaceState(null,'','#'+(t==='classic'?'more':t))}
function paint(){if(!ME)return;const a=document.activeElement;if(a&&a.closest&&a.closest('#v')&&/INPUT|TEXTAREA/.test(a.tagName))return;
 const y=$('v').scrollTop;({home,coins,sales,swaps,more}[cur]||(()=>{}))();$('v').scrollTop=y}
async function tick(){if(!ME||document.hidden)return;try{await load();if(cur==='swaps')await swapRefresh();paint()}catch(e){}}
function tg(id){OPEN[id]=!OPEN[id];if(OPEN[id]&&cur==='swaps')swapRefresh().then(paint);paint()}

/* ---------- HOME ---------- */
function home(){
 const co=coinOrders(),so=saleOrders(),sw=swapCases(),un=D.convs.reduce((s,x)=>s+(+x.unread||0),0);
 const cNeed=co.filter(o=>o.status=='awaiting_review'||(o.status=='approved'&&(!o.claimed_by||o.kcode))).length;
 const sNeed=so.filter(o=>['awaiting_review','pending'].includes(o.status)||o.status=='approved').length;
 const tile=(cls,ic,t,sub,n,f)=>`<button class="tile ${cls}" onclick="${f}"><small>${ic} ${t}</small><div class="n">${n}</div><small>${sub}</small></button>`;
 $('v').innerHTML=`<h2 class="t">Today <small class="sub" style="font-weight:400">${new Date().toLocaleDateString()}</small></h2>
 <div class="grid">
  ${tile(cNeed?'hot':'','🪙','Coin orders','A · needs action: '+cNeed,co.filter(o=>['awaiting_review','approved'].includes(o.status)).length,"go('coins')")}
  ${tile(sNeed?'hot':'','🏷️','Account sales','B → E · open: '+sNeed,so.filter(o=>!['delivered','rejected'].includes(o.status)).length,"go('sales')")}
  ${tile(sw.length?'hot':'','🔁','Swaps','C ⇄ F · open',sw.length,"go('swaps')")}
  ${tile(un?'hot':'','💬','Unread chats','Messages',un,"go('chat')")}
  ${tile(D.subs?'hot':'','📥','Sell requests','To review & list',D.subs,"go('classic','subs')")}
 </div>
 <div class="box2"><b>Who is who</b>${LEGEND}</div>`}

/* ---------- COINS (A) ---------- */
function coinCase(o){
 const jp=/japan/i.test((o.product||'')+' '+(o.package||'')),ct=jp?2:1,id='o'+o.id;
 const sp=(o.info||'').indexOf(' '),em=sp>0?o.info.slice(0,sp):'',pw=sp>0?o.info.slice(sp+1):(o.info||'');
 const paid=['approved','delivered'].includes(o.status),mine=o.claimed_by&&ME&&o.claimed_by===ME.id,rd=D.ready[o.code],done=o.status=='delivered';
 const next=o.status=='awaiting_review'?'Approve payment':o.status=='approved'?(!o.claimed_by?'Take it':o.kcode?'Deliver now':o.code_req?'Waiting for code':'Ask Code '+ct):'';
 const sBadge=o.status=='approved'?chip(next,o.kcode?'g':''):chip(({awaiting_review:'🔎 To verify',delivered:'✅ Delivered',rejected:'❌ Rejected',pending:'⏳ Not paid'})[o.status]||E(o.status),done?'g':o.status=='rejected'?'r':'');
 let b='';
 b+=stp(1,'Payment',paid?'done':'now',`${chip('💰 '+E(o.amount)+' ETB')} ${o.tx_ref?`<code>${E(o.tx_ref)}</code> ${cpB(o.tx_ref)}`:''}${o.auto_note?`<div>🤖 ${E(o.auto_note)}</div>`:''}
  ${o.receipt_path?`<div class="row">${bt('🖼 Receipt',`rcpt(${o.id},this)`)}${o.status=='awaiting_review'?bt('🔍 Check',`chk(${o.id},this)`):''}</div><div id="rc${o.id}"></div>`:''}
  ${o.status=='awaiting_review'?`<div class="row">${bt('✅ Approve',`ordAct(${o.id},'ok')`,'')}${bt('❌ Reject',`ordAct(${o.id},'no')`)}</div>`:''}

 b+=stp(1,'B · account login',cr||sc.c1?'done':'now',`${cr?loginH(...splitLogin(cr)):'<small class="sub">Not loaded yet</small>'}<div class="row">${bt('📨 Ask B for login',`sAskLogin(${o.id})`)}${bt('👁 Show login',`sShow(${c},this)`)}</div>`);

 b+=stp(3,'Verified',M.verified?'done':(sc.c1?'now':'todo'),M.verified?`✅ Verified ${ago(M.verified)}`:`<div class="row">${bt('✅ Verified — account is OK',`sVerified(${o.id})`,'')}</div><small class="sub">Tells E the account is verified.</small>`);
 b+=stp(4,'Code 3 · Email change code (from B)',sc.c2?'done':(M.verified?'now':'todo'),`${sc.c2?codeH(sc.c2):'<small class="sub">⏳ not received</small>'}<div class="row">${bt(sc.c2?'🔁 Ask Code 3 again':'🔐 Ask B for Code 3',`sAskCode(${o.id},3)`)}</div>`);
 b+=stp(5,'E pays',paid?'done':(M.pay||sc.c2?'now':'todo'),paid?'💰 Payment received':`${M.pay?`✅ E was asked ${ago(M.pay)}`:''}<div class="row">${bt(M.pay?'🔁 Ask E to pay again':'💰 Ask E to pay',`sPay(${o.id})`)}</div>${o.status=='awaiting_review'?`<div class="row">${bt('✅ Approve payment',`ordAct(${o.id},'ok')`,'')}${bt('❌ Reject',`ordAct(${o.id},'no')`)}</div>`:''}${o.receipt_path?`<div class="row">${bt('🖼 Receipt',`rcpt(${o.id},this)`)}</div><div id="rc${o.id}"></div>`:''}`);
 b+=stp(6,'Hand over & close',done?'done':(paid?'now':'todo'),done?'✅ Handed over':paid?`${!o.claimed_by?`<div class="row">${bt('🙋 I will hand it over',`ordAct(${o.id},'claim')`,'')}</div>`:mine?`<input type="file" accept="image/*" id="pf${o.id}"><div class="row">${bt('✅ Delivered',`finish(${o.id})`,'')}${bt('🔒 Sold / Close listing',`sClose(${c})`)}</div>`:`<div>🔒 Taken by ${E(o.claimed_by_name||'another admin')}</div>`}`:'<small class="sub">After E pays.</small>');
 return `<div class="cs${OPEN[id]?' open':''}"><div class="csh" onclick="tg('${id}')"><div class="m"><b>#${o.id} · ${E(l.title||o.product||'Account')}</b><small>B → E · ${E(o.amount)} ETB · ${ago(o.created_at)}</small></div>${sBadge}<span class="ch">›</span></div><div class="csb">${b}</div></div>`}

/* ---------- SWAPS (C owner, F requester) ---------- */
function swapCases(){
 const by={};[...D.xm].reverse().forEach(m=>{(by[m.conv_id]=by[m.conv_id]||[]).push(m)});const out=[];
 for(const cid in by){const ms=by[cid];let last=null,acc=null,off=null;
  ms.forEach(m=>{if(m.kind=='exchange_offer'){last='o';off=m}else if(m.kind=='exchange_accept'){last='a';acc=m}else if(m.kind=='exchange_decline')last='d'});
  if(last!=='a'||!acc)continue;const ref='x'+cid,M=mk(ref);if(M.done)continue;
  const cv=(D.conv||[]).find(c=>c.id==cid)||{},C=acc.sender_id||cv.seller_id||null,F=(off&&off.sender_id)||cv.buyer_id||null;
  const after=ms.filter(m=>m.id>acc.id);let payer=null,declined=false;
  after.forEach(m=>{if(m.kind=='fee_sender'){payer=m.sender_id;declined=false}else if(m.kind=='fee_agree'){payer=m.sender_id;declined=false}else if(m.kind=='fee_decline'){payer=null;declined=true}});
  out.push({cid:+cid,ref,M,C,F,offer:(off&&off.meta)||{},acc,unlocked:after.some(m=>m.kind=='verify_done'),payer,declined,asked:after.some(m=>m.kind=='fee_ask')&&!payer})}
 return out.sort((a,b)=>b.cid-a.cid)}
function supOf(uid){if(!uid)return null;const c=(D.conv||[]).find(x=>x.kind==='support'&&x.buyer_id===uid);return c?c.id:(XS.sup[uid]||null)}
const nameOf=uid=>{const s=supOf(uid),c=s&&D.convs.find(x=>x.id==s);return(c&&pkey(c.title))||(uid?String(uid).slice(0,6):'?')};
async function findSup(uid){if(!uid||supOf(uid))return;const sups=D.convs.filter(c=>isSupT(c.title)).map(c=>c.id);if(!sups.length)return;const{data}=await sb.from('messages').select('conv_id').eq('sender_id',uid).in('conv_id',sups).limit(1);if(data&&data[0])XS.sup[uid]=data[0].conv_id}
async function partyLoad(uid,since,ref){await findSup(uid);const sup=supOf(uid);if(!sup)return;
 const{data}=await sb.from('messages').select('id,kind,meta,created_at,body').eq('conv_id',sup).order('id',{ascending:false}).limit(300);const ms=(data||[]).reverse().filter(m=>new Date(m.created_at)>=new Date(since)-60000);
 const P={sup,login:null,codes:{}};let lastCt=null;
 for(const m of ms){if(m.meta&&m.meta.step==='ctype'&&m.meta.ref===ref){lastCt=m.meta.ctype;continue}
  if(m.kind=='vr_ask'&&m.meta){const an=ms.find(x=>x.kind=='vr_answer'&&x.meta&&x.meta.req==m.meta.req),r={req:m.meta.req,at:m.created_at,ans:an?an.created_at:null};if(m.meta.want=='login')P.login=r;else if(lastCt){P.codes[lastCt]=r;lastCt=null}}}
 const need=[P.login,...Object.values(P.codes)].filter(r=>r&&r.ans&&!XS.val[r.req]);
 for(const r of need){const g=await sb.rpc('admin_vr_get',{p_req:r.req});if(!g.error&&g.data)XS.val[r.req]=g.data}
 XS.party[uid+':'+ref]=P}
async function swapRefresh(){const cs=swapCases();await Promise.all(cs.filter(c=>OPEN['x'+c.cid]).flatMap(c=>[partyLoad(c.C,c.acc.created_at,c.ref),partyLoad(c.F,c.acc.created_at,c.ref)]))}
async function vrAsk(uid,want,ct,ref){act(async()=>{await findSup(uid);const sup=supOf(uid);if(!sup){alert('This person has no Support chat yet. Ask them to open Messages > Support and send "Hi".');return}
 if(want=='code'){const e=await sb.rpc('send_message',{p_conv:sup,p_body:CASK[ct],p_meta:{adm:1,ref,step:'ctype',ctype:ct}});if(e.error){alert('Failed: '+e.error.message);return}}
 const{data:mid,error}=await sb.rpc('admin_vr_ask',{p_conv:sup,p_want:want});if(error){alert('Error: '+error.message);return}pingPush(mid);const cs=swapCases().find(x=>x.ref===ref);await partyLoad(uid,cs?cs.acc.created_at:0,ref)})}

function partyBlock(c,who,uid){
 const P=XS.party[uid+':'+c.ref]||{},lg=P.login,lv=lg&&lg.ans?XS.val[lg.req]:null,nm=nameOf(uid);
 const codeRow=n=>{const r=(P.codes||{})[n],v=r&&r.ans?XS.val[r.req]:null;return `<div style="margin-top:6px"><b>Code ${n}</b> · ${CT[n]}${v&&v.code?`<div>${codeH(v.code,r.ans)}</div>`:r?`<div>⏳ Waiting… (${ago(r.at)})</div>`:''}<div class="row">${bt(r?`🔁 Ask Code ${n} again`:`🔐 Ask ${who} for Code ${n}`,`vrAsk('${uid}','code',${n},'${c.ref}')`)}</div></div>`};
 const [e,p]=lv?[lv.email,lv.pass]:['',''];
 return `<div class="pp"><b>${who} · ${E(nm)}</b>${!supOf(uid)?'<div>⚠️ No Support chat yet</div>':''}
  <div>${lv&&(e||p)?loginH(e,p):lg?`<div>⏳ Waiting for login… (${ago(lg.at)})</div>`:'<small class="sub">Login not asked yet</small>'}</div>
  <div class="row">${bt(lg?'🔁 Ask login again':`🔑 Ask ${who} for email + password`,`vrAsk('${uid}','login',0,'${c.ref}')`)}</div>${codeRow(2)}${codeRow(3)}</div>`}
function swapCase(c){
 const id='x'+c.cid,o=c.offer,mode=o.mode=='even'?'Even swap':o.mode=='buyer_adds'?'F adds '+(o.amount||0)+' ETB':o.mode=='seller_adds'?'C adds '+(o.amount||0)+' ETB':E(o.mode||'');
 const who=uid=>uid&&uid===c.C?'C':uid&&uid===c.F?'F':'?';
 const adder=o.mode=='buyer_adds'?'F':o.mode=='seller_adds'?'C':null;
 const PC=XS.party[c.C+':'+c.ref]||{},PF=XS.party[c.F+':'+c.ref]||{};
 const logins=!!(PC.login&&PC.login.ans&&PF.login&&PF.login.ans),codes=['2','3'].every(n=>(PC.codes||{})[n]&&PC.codes[n].ans&&(PF.codes||{})[n]&&PF.codes[n].ans);
 const step=!c.unlocked?'Unlock payment':!c.M.paid?'Payment':!logins?'Logins':!codes?'Codes':'Finish';
 let b=`<div class="pp"><b>🔁 Deal</b>${chip(mode)} ${o.ovr?chip('OVR '+E(o.ovr)):''}${o.note?`<div>${E(o.note)}</div>`:''}<div class="row" style="gap:6px;margin-top:6px">${(o.images||[]).map(q=>`<a href="${CFG.URL}/storage/v1/object/public/chat/${E(q)}" target="_blank"><img src="${CFG.URL}/storage/v1/object/public/chat/${E(q)}" style="width:70px;height:70px;object-fit:cover;border-radius:10px"></a>`).join('')}</div></div>`;
 const due=[];if(adder)due.push(`<div>💵 <b>${adder}</b> must pay the added money: <b>${o.amount||0} ETB</b></div>`);
 due.push(`<div>🧾 eFootballET fee <b>100 ETB</b> → ${c.payer?`paid by <b>${who(c.payer)}</b>`:c.declined?'⚠️ declined, they must choose again':c.asked?'⏳ one asked the other to pay':'⏳ not chosen yet'}</div>`);
 b+=stp(1,'Payment',c.M.paid?'done':'now',`${due.join('')}${c.unlocked?'<div>🔓 Payment step is open for both users</div>':''}<div class="row">${c.unlocked?'':bt('🔓 Open payment (C & F choose who pays)',`xUnlock(${c.cid})`,'')}${c.M.paid?'':bt('✅ Payment received',`xPaid(${c.cid})`,c.unlocked?'':'s')}</div>${c.M.paid?`<div>✅ Received ${ago(c.M.paid)}</div>`:''}`);
 b+=stp(2,'Logins & codes · C',logins&&codes?'done':(c.M.paid?'now':'todo'),partyBlock(c,'C',c.C));
 b+=stp(3,'Logins & codes · F',logins&&codes?'done':(c.M.paid?'now':'todo'),partyBlock(c,'F',c.F));
 b+=stp(4,'Finish',logins&&codes?'now':'todo',`<div class="row">${bt('🎉 Swap completed',`xDone(${c.cid})`,'')}</div>`);
 return `<div class="cs${OPEN[id]?' open':''}"><div class="csh" onclick="tg('${id}')"><div class="m"><b>#${c.cid} · ${E(nameOf(c.F))} ⇄ ${E(nameOf(c.C))}</b><small>F ⇄ C · ${mode}</small></div>${chip(step)}<span class="ch">›</span></div><div class="csb">${b}</div></div>`}

function beep3(){try{const c=new (window.AudioContext||window.webkitAudioContext)();[0,.22,.44].forEach((t,i)=>{const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=i===2?1175:880;g.gain.setValueAtTime(.0001,c.currentTime+t);g.gain.exponentialRampToValueAtTime(.35,c.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+t+.18);o.start(c.currentTime+t);o.stop(c.currentTime+t+.2)})}catch(e){}}

 document.body.appendChild(d);

async function ensurePush(quiet){if(!('Notification' in window)||Notification.permission!=='granted')return;await enablePush(quiet)}
async function enablePush(quiet){try{
 if(!('PushManager' in window))return quiet||alert('Push is not supported in this browser.');
 const p=await Notification.requestPermission();if(p!=='granted')return quiet||alert('Notifications were not allowed. Turn them on in phone Settings.');
 const reg=await navigator.serviceWorker.ready;let s=await reg.pushManager.getSubscription();
 if(s&&localStorage.avk!==VAPID){await s.unsubscribe();s=null}localStorage.avk=VAPID;
 if(!s)s=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u8(VAPID)});
 const j=s.toJSON();const r=await sb.rpc('save_push_admin',{p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth});
 if(r.error)return quiet||alert('Could not save: '+r.error.message+' (run migration29)');
 if(!quiet)alert('✅ Admin notifications are ON for this phone.');paint()}catch(e){quiet||alert('Error: '+e.message)}}
