<style>
*{-webkit-user-select:text!important;user-select:text!important;-webkit-touch-callout:default!important}
.xs{padding:10px 0;border-top:1px solid #ffffff0f}.xs>b{display:block;margin-bottom:6px}.xs .btn{width:100%;margin-top:8px}.xcode{font-size:34px;font-weight:800;letter-spacing:.14em;color:#F2B705;font-family:ui-monospace,Menlo,monospace}
:root{--hh:calc(54px + env(safe-area-inset-top,0px));--nh:96px}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--t)}
.ah{position:fixed;top:0;left:0;right:0;height:var(--hh);box-sizing:border-box;padding:env(safe-area-inset-top,0) 16px 0;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(180deg,#1b1442,#120d2e);border-bottom:1px solid var(--l);z-index:20}

.pane{position:fixed;top:var(--hh);bottom:var(--nh);left:0;right:0;overflow:auto;padding:14px;box-sizing:border-box}
iframe.pane{border:0;width:100%;padding:0;background:var(--bg);height:calc(100vh - var(--hh) - var(--nh));height:calc(100dvh - var(--hh) - var(--nh))}
nav[hidden]{display:none!important}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0}
.card{background:var(--b2);border:1px solid var(--l);border-radius:18px;padding:14px;cursor:pointer;text-align:left;color:var(--t);font:inherit}
.card .n{font-size:32px;font-weight:800;line-height:1.1;margin-top:4px}
.card.hot{border-color:var(--a);box-shadow:0 0 0 1px var(--a) inset}

.big{grid-column:1/-1}
.brow{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}

.bd{position:absolute;top:2px;left:calc(50% + 8px);min-width:18px;height:18px;border-radius:99px;background:#ef4444;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.bd[hidden]{display:none}
.lg{max-width:380px;margin:12vh auto 0}.lg input{width:100%;box-sizing:border-box;margin:6px 0 12px}

.card{background:linear-gradient(160deg,#1c1f33,#121423);border:1px solid #ffffff17;box-shadow:0 12px 28px #0007,inset 0 1px 0 #ffffff14;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,#ffffff12 50%,transparent 60%);transform:translateX(-120%);transition:transform .8s var(--ease);pointer-events:none}
.card:active::before{transform:translateX(120%)}
.card .n{background:linear-gradient(180deg,#fff 15%,#F2B705);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}

.dh{display:flex;align-items:center;gap:12px;margin:2px 0 14px}

.it.open .ith .ch{transform:rotate(90deg)}
.xd{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s var(--ease)}
.it.open .xd{grid-template-rows:1fr}
.xd>div{overflow:hidden;min-height:0}
.xb{padding:2px 14px 14px;line-height:1.6}

.kov{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px;background:#05060dd9;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);animation:paneIn .35s var(--ease) both}
.kbox{width:100%;max-width:380px;text-align:center;background:linear-gradient(160deg,#241c4d,#121423);border:1px solid #F2B70577;border-radius:24px;padding:22px 18px;box-shadow:0 0 40px #F2B70533,0 20px 50px #000a}
.kbox .kt{font-weight:800;font-size:18px}

<script>
const sb=supabase.createClient(CFG.URL,CFG.KEY),$=i=>document.getElementById(i);
const VAPID='BA7-v2x2GvoU1Jcuf1WqX1z6o787aSupTfXRWXZkysCgAGKaJTE78Qv0R2hUUibxGF6dtl40nESqBebHb1CthAc';
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const u8=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return Uint8Array.from(atob(s),c=>c.charCodeAt(0))};
const BUILD=Date.now();let cur='home',timer=null,ME=null;
if('serviceWorker' in navigator)navigator.serviceWorker.register('/admin-panel/sw.js',{scope:'/admin-panel/'}).catch(()=>{});

/* ---------- login ---------- */
function login(msg=''){clearInterval(timer);clearInterval(KW);$('nav').hidden=true;$('fo').hidden=$('fm').hidden=true;$('v').hidden=false;$('who').textContent='';
 $('v').innerHTML=`<div class="lg"><h1>🔐 eFootballET ADMIN</h1><label>Email</label><input id="em" type="email" autocomplete="username"><label>Password</label><input id="pw" type="password" autocomplete="current-password"><div class="err">${E(msg)}</div><button class="btn" id="lgb">Log in</button></div>`;
 $('lgb').onclick=async()=>{$('lgb').disabled=true;const{error}=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});if(error){login('Wrong email or password');return}start()}}
async function start(){
 const{data:{session}}=await sb.auth.getSession();if(!session)return login();
 const a=await sb.rpc('is_admin');if(a.error||!a.data){await sb.auth.signOut();return login('This account is not an admin.')}
 ME=session.user;$('who').textContent=(ME.email||'').split('@')[0];$('nav').hidden=false;
 const h=location.hash.slice(1);go(['orders','msgs','more'].includes(h)?h:'home');
 refresh();clearInterval(timer);timer=setInterval(refresh,6000);clearInterval(KW);KW=setInterval(codeWatch,2500);codeWatch();ensurePush(true)}

/* ---------- navigation ---------- */
function setNav(t){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t))}
function fixMsgFrame(){try{const d=$('fm').contentDocument;if(!d||!d.head||d.getElementById('shellfix'))return;const st=d.createElement('style');st.id='shellfix';st.textContent='.cin{align-items:center!important}.cin input{flex:1!important;width:auto!important;margin:0!important;min-width:0!important;border-radius:24px!important}.cin .btn{width:46px!important;height:46px!important;flex:none!important;margin:0!important;padding:0!important;border-radius:50%!important;display:grid!important;place-items:center!important}.cin .btn::after{display:none!important}.chh .btn{width:auto!important;margin:0!important}.cms{padding-bottom:130px!important}';d.head.appendChild(st)}catch(e){}}
function frame(id,src){const f=$(id);if(!f.getAttribute('src'))f.src=src;return f}
function go(t,hash){cur=t;view='dash';setNav(t);setTimeout(refresh,300);
 $('v').hidden=!(t==='home'||t==='more');$('fo').hidden=t!=='orders';$('fm').hidden=t!=='msgs';
 if(t==='home')dash();
 if(t==='more')more();
 if(t==='orders'){const f=frame('fo','/admin.html?v='+BUILD+'#'+(hash||'awaiting_review'));if(hash){try{f.contentWindow.location.hash=hash}catch(e){}}}
 if(t==='msgs')frame('fm','/adminmsg.html?v='+BUILD);
 {const P=t==='orders'?$('fo'):t==='msgs'?$('fm'):$('v');P.classList.remove('sw');void P.offsetWidth;P.classList.add('sw')}
 history.replaceState(null,'','#'+t)}
function openOrders(hash,navTab){go('orders',hash);if(navTab)setNav(navTab)}

/* ---------- dashboard ---------- */
let KWAIT=[],KSEEN={},KW=null;try{KSEEN=JSON.parse(localStorage.kseen||'{}')}catch(e){}
let D={},ORD=[],RDY={},CVS=[],PXM={},view='dash',dk='',OPEN={},EXD={};
async function load(){
 const[o,c,r,xm,rm]=await Promise.all([
  sb.from('orders').select('*').order('id',{ascending:false}).limit(300),
  sb.rpc('admin_convs'),sb.from('order_ready').select('*'),sb.from('messages').select('conv_id,kind,id').in('kind',['exchange_accept','verify_done','exchange_decline']).order('id',{ascending:false}).limit(1000),sb.from('messages').select('meta,created_at').not('meta->>ready','is',null).order('id',{ascending:false}).limit(200)]);
 if(o.error&&/JWT|auth/i.test(o.error.message||''))return login('Please log in again.');
 const rows=o.data||[],convs=c.data||[],ready={};(r.data||[]).forEach(x=>{ready[x.order_code]=x.ready_at});(rm&&rm.data||[]).forEach(x=>{const k=x.meta&&x.meta.ready;if(k&&!ready[k])ready[k]=x.created_at});
 const today=new Date().toDateString(),td=rows.filter(x=>new Date(x.created_at).toDateString()===today);
 const seenX={},PX0={};let exch=0;(xm.data||[]).forEach(m=>{if(seenX[m.conv_id])return;seenX[m.conv_id]=1;if(m.kind==='exchange_accept'){exch++;PX0[m.conv_id]=1}});
 D={exch,verify:rows.filter(x=>x.status==='awaiting_review').length,
  deliver:rows.filter(x=>x.status==='approved'&&!x.claimed_by).length,
  working:rows.filter(x=>x.status==='approved'&&x.claimed_by).length,
  ready:rows.filter(x=>x.status==='approved'&&ready[x.code]).length,
  unread:convs.reduce((s,x)=>s+(+x.unread||0),0),
  today:td.length,
  sales:td.filter(x=>['approved','delivered'].includes(x.status)).reduce((s,x)=>s+(+x.amount||0),0),
  delivered:td.filter(x=>x.status==='delivered').length};ORD=rows;RDY=ready;CVS=convs;PXM=PX0;
 const b1=D.verify+D.deliver,b2=D.unread;
 $('b1').textContent=b1>99?'99+':b1;$('b1').hidden=!b1;$('b2').textContent=b2>99?'99+':b2;$('b2').hidden=!b2;
 document.title=(b1+b2)?`(${b1+b2}) eFootballET ADMIN`:'eFootballET ADMIN'}
async function refresh(){try{await load();if(cur==='home')paint()}catch(e){}}
async function dash(){paint();await refresh()}
function card(cls,label,sub,n,click){return `<button class="card ${cls}" onclick="${click}"><small>${label}</small><div class="n" data-v="${n}">${n}</div><small>${sub}</small></button>`}
function paint(){
 if(cur!=='home')return;
 if(view==='detail')return paintDetail();
 const notif=('Notification' in window)?Notification.permission:'unsupported';
 $('v').innerHTML=`
 ${KWAIT.length?`<div class="kwait" onclick="detail('deliver')"><i>⏳</i><span>Waiting for customer code: ${KWAIT.map(o=>'#'+o.id).join(', ')}</span></div>`:''}
 <h2 style="margin:4px 0">Today <small class="sub" style="font-weight:400">${new Date().toLocaleDateString()}</small></h2>
 <div class="grid">
  ${card(D.exch?'hot':'','🔁 Exchange to verify','ለማረጋገጥ መለዋወጥ',D.exch??'…',"detail('exch')")}
  ${card(D.verify?'hot':'','🔎 To verify','ለማረጋገጥ',D.verify??'…',"detail('verify')")}
  ${card(D.deliver?'hot':'','📦 To deliver','ለማድረስ',D.deliver??'…',"detail('deliver')")}
  ${card(D.ready?'hot':'','🟢 Ready now','ዝግጁ የሆኑ ደንበኞች',D.ready??'…',"detail('ready')")}
  ${card(D.unread?'hot':'','💬 Unread','ያልተነበቡ መልዕክቶች',D.unread??'…',"detail('unread')")}
  ${card('','🛒 Orders today','የዛሬ ትዕዛዞች',D.today??'…',"detail('today')")}
  ${card('','✅ Delivered today','ዛሬ የደረሱ',D.delivered??'…',"detail('delivered')")}
  <div class="card big"><small>💰 Sales today (verified)</small><div class="n" data-v="${D.sales??0}">${(D.sales??0).toLocaleString()} <small style="display:inline">ETB</small></div></div>
 </div>
 <div class="box"><b>🔔 Notifications</b><p class="sub" style="margin:6px 0">${notif==='granted'?'On for this phone. You are alerted about new orders, receipts, ready customers and messages.':'Turn them on to get alerts for new orders, receipts, ready customers and messages.'}</p>
  <div class="brow"><button class="btn s" onclick="enablePush()">${notif==='granted'?'Re-register':'Turn on'}</button><button class="btn s" onclick="testPush()">Send test</button></div></div>`;if(document.documentElement.classList.contains('pa'))countUp()}

/* ---------- dashboard detail (full order info inside) ---------- */
const STL={awaiting_review:'🔎 To verify',approved:'📦 Approved',delivered:'✅ Delivered',rejected:'❌ Rejected',pending:'⏳ Pending'};
const KT={exch:['🔁 Exchange to verify','ለማረጋገጥ መለዋወጥ'],verify:['🔎 To verify','ለማረጋገጥ'],deliver:['📦 To deliver','ለማድረስ'],ready:['🟢 Ready now','ዝግጁ የሆኑ ደንበኞች'],unread:['💬 Unread','ያልተነበቡ መልዕክቶች'],today:['🛒 Orders today','የዛሬ ትዕዛዞች'],delivered:['✅ Delivered today','ዛሬ የደረሱ']};
const ago=t=>{const m=Math.max(0,Math.round((Date.now()-new Date(t))/60000));return m<1?'now':m<60?m+' min ago':m<1440?Math.floor(m/60)+' h ago':Math.floor(m/1440)+' d ago'};
function cpd(b){const t=b.dataset.t||'';try{navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(x){}a.remove()}b.textContent='✅';setTimeout(()=>b.textContent='📋',1200)}
const cpB=t=>`<button class="cpb" data-t="${E(t)}" onclick="event.stopPropagation();cpd(this)">📋</button>`;
function tg(id){OPEN[id]=!OPEN[id];const el=document.getElementById('it'+id);if(el)el.classList.toggle('open',!!OPEN[id])}
function listFor(k){
 const today=new Date().toDateString(),isT=o=>new Date(o.created_at).toDateString()===today;
 if(k==='verify')return ORD.filter(o=>o.status==='awaiting_review');
 if(k==='deliver')return ORD.filter(o=>o.status==='approved'&&!o.claimed_by);
 if(k==='ready')return ORD.filter(o=>o.status==='approved'&&RDY[o.code]);
 if(k==='today')return ORD.filter(isT);
 if(k==='delivered')return ORD.filter(o=>isT(o)&&o.status==='delivered');
 if(k==='exch')return CVS.filter(c=>PXM[c.id]);
 if(k==='unread')return grpC(CVS.filter(c=>+c.unread>0));
 return []}
function ordIt(o){
 const id='o'+o.id,acc=['ef','account','player'].includes(o.cat),sp=(o.info||'').indexOf(' ');
 let inf='';
 if(acc&&sp>0){const e=o.info.slice(0,sp),p=o.info.slice(sp+1);inf=`<div class="r">📧 <code>${E(e)}</code> ${cpB(e)}</div><div class="r">🔑 <code>${E(p)}</code> ${cpB(p)}</div>`}
 else if(o.info)inf=`<div class="r">🔑 <code>${E(o.info)}</code> ${cpB(o.info)}</div>`;
 const tab=['awaiting_review','approved','delivered','rejected'].includes(o.status)?o.status:'awaiting_review';
 const rd=RDY[o.code];
 return `<div class="it${OPEN[id]?' open':''}" id="it${id}"><div class="ith" onclick="tg('${id}')"><div class="m"><b>#${o.id} · ${E(o.product)} — ${E(o.package)}</b><small>💰 ${E(o.amount)} ETB · 📞 ${E(o.phone||'')} · ${ago(o.created_at)}</small></div><span class="st">${STL[o.status]||E(o.status)}</span><span class="ch">›</span></div>
 <div class="xd"><div><div class="xb">
  <div class="r"><span class="st">${STL[o.status]||E(o.status)}</span> 🔖 <code>${E(o.code)}</code> ${cpB(o.code)}</div>
  <div class="r">🕒 ${new Date(o.created_at).toLocaleString()} (${ago(o.created_at)})</div>
  <div class="r">📦 ${E(o.product)} — ${E(o.package)}</div>
  <div class="r">💰 <b>${E(o.amount)} ETB</b>${o.promo?` · 🎟 ${E(o.promo)} (−${E(o.discount)})`:''}</div>
  ${o.phone?`<div class="r">📞 <a href="tel:${E(o.phone)}">${E(o.phone)}</a> ${cpB(o.phone)}</div>`:''}
  ${o.tg?`<div class="r">✈️ ${E(o.tg)}</div>`:''}
  ${inf}
  ${o.kcode?`<div class="r">🔐 Konami code: <b style="font-size:20px">${E(o.kcode)}</b> ${cpB(o.kcode)}</div>`:(o.code_req?'<div class="r">⏳ Customer is sending the code…</div>':'')}
  ${o.status==='approved'?(rd?`<div class="r">🟢 Customer is ready (${ago(rd)})</div>`:'<div class="r">⏳ Customer is not ready yet</div>'):''}
  ${o.claimed_by?`<div class="r">🙋 ${E(o.claimed_by_name||'Claimed')}</div>`:(o.status==='approved'?'<div class="r">🙋 Not claimed yet</div>':'')}
  ${o.tx_ref?`<div class="r">🔢 <code>${E(o.tx_ref)}</code> ${cpB(o.tx_ref)} <a href="https://transactioninfo.ethiotelecom.et/receipt/${E(o.tx_ref)}" target="_blank" rel="noopener">🔗 Telebirr</a></div>`:''}
  ${o.auto_note?`<div class="r">🤖 ${E(o.auto_note)}</div>`:''}
  ${o.proof?`<div class="r"><img src="${CFG.URL}/storage/v1/object/public/proofs/${E(o.proof)}" style="max-width:100%;border-radius:12px"></div>`:''}
  <button class="btn" style="margin-top:10px;width:100%" onclick="openOrders('${tab}')">📂 Open in Orders (approve / deliver)</button>
 </div></div></div></div>`}
const pkey=t=>{t=String(t||'');const m=t.match(/\((?:buyer|seller)\s+([^)]+)\)/i)||t.match(/^\s*Support\s*[\u00b7\u2022:\-]\s*(.+?)\s*$/i);return m?m[1].trim():null};
const isSupT=t=>/^\s*Support/i.test(String(t||''));
function grpC(cs){const g={},out=[];(cs||[]).forEach(c=>{const k=pkey(c.title);if(!k){out.push(c);return}const K=k.toLowerCase();let x=g[K];if(!x){x=g[K]={id:c.id,title:k,last_text:c.last_text,last_at:c.last_at,unread:0,sup:null};out.push(x)}x.unread+=+c.unread||0;if(isSupT(c.title))x.sup=c.id;if(new Date(c.last_at)>new Date(x.last_at)){x.last_at=c.last_at;x.last_text=c.last_text}});out.forEach(x=>{if(x.sup)x.id=x.sup});return out}
async function pingPush(mid){try{const s=(await sb.auth.getSession()).data.session;if(s&&mid)fetch('/notifypush',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+s.access_token},body:JSON.stringify({msg_id:mid})})}catch(e){}}

/* ---------- exchange verification (login -> code -> verified) ---------- */
const XS={};let XPB=0,XSIG='';
async function xLoad(cid){
 const st=XS[cid]=XS[cid]||{};
 if(!st.uid){const{data}=await sb.from('messages').select('sender_id,id').eq('conv_id',cid).eq('kind','exchange_accept').order('id',{ascending:false}).limit(1);st.uid=(data&&data[0]&&data[0].sender_id)||null}
 if(st.uid&&!st.sup){const sups=CVS.filter(c=>isSupT(c.title)).map(c=>c.id);if(sups.length){const{data}=await sb.from('messages').select('conv_id').eq('sender_id',st.uid).in('conv_id',sups).limit(1);st.sup=(data&&data[0]&&data[0].conv_id)||null}}
 if(st.sup){const{data}=await sb.from('messages').select('id,kind,meta,created_at').eq('conv_id',st.sup).in('kind',['vr_ask','vr_answer']).order('id');const ms=data||[];
  for(const w of ['login','code']){const asks=ms.filter(m=>m.kind=='vr_ask'&&m.meta&&m.meta.want==w),a=asks[asks.length-1];if(!a){st[w]=null;continue}const an=ms.find(m=>m.kind=='vr_answer'&&m.meta&&m.meta.req==a.meta.req);st[w]={req:a.meta.req,at:a.created_at,ans:an?an.created_at:null};
   if(an&&(!st['d'+w]||st['d'+w].req!==a.meta.req)){const g=await sb.rpc('admin_vr_get',{p_req:a.meta.req});if(!g.error&&g.data)st['d'+w]={req:a.meta.req,v:g.data}}}}
 st.loaded=true}
async function xPoll(){if(XPB||cur!=='home'||view!=='detail'||dk!=='exch')return;XPB=1;try{const ids=listFor('exch').map(c=>c.id);await Promise.all(ids.map(xLoad));const sig=JSON.stringify(ids.map(i=>XS[i]));if(sig!==XSIG){XSIG=sig;try{await Promise.all(ids.map(xLoad))}catch(e){}
 if(cur==='home'&&view==='detail'&&dk==='exch')paintDetail()}}catch(e){}finally{XPB=0}}
async function xAsk(cid,w){const st=XS[cid];if(!st||!st.sup){alert('This customer has no Support chat yet.');return}
 const{data:mid,error}=await sb.rpc('admin_vr_ask',{p_conv:st.sup,p_want:w});if(error){alert(error.message=='NONE'?'This customer has no Support chat yet.':'Error: '+error.message);return}
 pingPush(mid);delete st['d'+w];await xLoad(cid);paintDetail()}
async function xVerified(cid){if(!confirm('Mark this account as verified and ask the buyer to pay?'))return;
 const{data,error}=await sb.rpc('send_message',{p_conv:cid,p_body:'',p_kind:'verify_done'});if(error){alert('Could not mark verified: '+error.message);return}
 pingPush(data);alert('✅ Verified. The buyer is now asked to pay.');refresh()}
function xPanel(c){
 const st=XS[c.id]||{};
 if(!st.loaded)return '<div class="r">⏳ Loading…</div>';
 if(!st.sup)return '<div class="r">⚠️ This customer has not opened the Support chat yet. Ask them to send a message to Support first.</div>';
 const L=st.login,C=st.code,dl=L&&st.dlogin&&st.dlogin.req===L.req?st.dlogin.v:null,dc=C&&st.dcode&&st.dcode.req===C.req?st.dcode.v:null;
 const wait=(r)=>r?(r.ans?'<div class="r">⏳ Opening…</div>':`<div class="r">⏳ Waiting for the customer… (${ago(r.at)})</div>`):'';
 let h=`<div class="xs"><b>① 🔑 Account login</b>`;
 if(dl&&(dl.email||dl.pass))h+=`<div class="r">📧 <code>${E(dl.email||'—')}</code> ${dl.email?cpB(dl.email):''}</div><div class="r">🔑 <code>${E(dl.pass||'—')}</code> ${dl.pass?cpB(dl.pass):''}</div>`;else h+=wait(L);
 h+=`<button class="btn s" onclick="xAsk(${c.id},'login')">${L?'🔁 Ask login again':'🔑 Ask customer for email + password'}</button></div>`;
 if(dl){h+=`<div class="xs"><b>② 🔐 Konami code</b>`;
  if(dc&&dc.code)h+=`<div class="r"><span class="xcode">${E(dc.code)}</span> ${cpB(dc.code)}</div><div class="r"><small>⏱ received ${ago(C.ans)}</small></div>`;else h+=wait(C);
  h+=`<button class="btn s" onclick="xAsk(${c.id},'code')">${C?'🔁 Ask new code':'🔐 Ask customer for the code'}</button></div>`;
  h+=`<div class="xs"><b>③ Done</b><button class="btn" onclick="xVerified(${c.id})">✅ Verified — ask buyer to pay</button></div>`}
 return h}
function convIt(c){
 const id='c'+c.id,x=EXD[c.id],U0=CFG.URL+'/storage/v1/object/public/chat/',ex=dk==='exch';
 let det='';
 if(x){det=`<div class="r">🔁 <b>${E(x.mode||'')}</b> ${E(x.amount||0)} ETB · OVR ${E(x.ovr||'')}</div>${x.note?`<div class="r">📝 ${E(x.note)}</div>`:''}${(x.images||[]).length?`<div class="r" style="gap:6px">${(x.images||[]).map(q=>`<a href="${U0+E(q)}" target="_blank"><img src="${U0+E(q)}" style="width:76px;height:76px;object-fit:cover;border-radius:10px"></a>`).join('')}</div>`:''}`}
 else if(ex)det='<div class="r">⏳ Loading offer…</div>';
 return `<div class="it${OPEN[id]?' open':''}" id="it${id}"><div class="ith" onclick="tg('${id}')"><div class="m"><b>${E(c.title)}${PXM[c.id]?' <span class="st">🔁 Verify exchange</span>':''}</b><small>${E(c.last_text||'')}</small></div>${+c.unread?`<span class="bd2">${E(c.unread)}</span>`:''}<span class="ch">›</span></div>
 <div class="xd"><div><div class="xb">${ex?'':`<div class="r">💬 ${E(c.last_text||'—')}</div>`}${det}${ex?xPanel(c):`<button class="btn" style="margin-top:10px;width:100%" onclick="openChat(${c.id})">💬 Open chat</button>`}</div></div></div></div>`}
function paintDetail(){
 const L=listFor(dk),T=KT[dk]||['',''],isC=dk==='exch'||dk==='unread';
 $('v').innerHTML=`<div class="dh"><button class="back" onclick="view='dash';paint()">‹</button><div><h2>${T[0]}</h2><small>${T[1]} · ${L.length}</small></div></div>`+(L.length?L.map(isC?convIt:ordIt).join(''):'<p class="sub" style="text-align:center;margin-top:40px">✨ ምንም የለም · Nothing here</p>')}
function detail(k){cur='home';view='detail';dk=k;OPEN={};EXD={};setNav('home');$('v').hidden=false;$('fo').hidden=$('fm').hidden=true;$('v').scrollTop=0;paintDetail();const P=$('v');P.classList.remove('sw');void P.offsetWidth;P.classList.add('sw');if(k==='exch')loadExd();history.replaceState(null,'','#home')}
async function loadExd(){const ids=listFor('exch').map(c=>c.id);if(!ids.length)return;

function beep3(){try{const c=new (window.AudioContext||window.webkitAudioContext)();[0,.22,.44].forEach((t,i)=>{const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=i===2?1175:880;g.gain.setValueAtTime(.0001,c.currentTime+t);g.gain.exponentialRampToValueAtTime(.35,c.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+t+.18);o.start(c.currentTime+t);o.stop(c.currentTime+t+.2)})}catch(e){}}

 document.body.appendChild(d);

async function enablePush(quiet){try{
 if(!('PushManager' in window))return quiet||alert('Push is not supported in this browser.');
 const p=await Notification.requestPermission();if(p!=='granted')return quiet||alert('Notifications were not allowed. Turn them on in phone Settings.');
 const reg=await navigator.serviceWorker.ready;let s=await reg.pushManager.getSubscription();
 if(s&&localStorage.avk!==VAPID){await s.unsubscribe();s=null}localStorage.avk=VAPID;
 if(!s)s=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u8(VAPID)});
 const j=s.toJSON();const r=await sb.rpc('save_push_admin',{p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth});
 if(r.error)return quiet||alert('Could not save: '+r.error.message+' (run migration29)');
